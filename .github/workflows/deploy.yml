# Production deploys only the public directory from an exact, successful main CI commit.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Gate on successful CI for current main
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      eligible: ${{ steps.ci.outputs.eligible }}
    steps:
      - name: Verify exact commit and completed CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid deployment commit."
            exit 1
          fi
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$CANDIDATE_SHA" != "$MAIN_SHA" ]]; then
            echo "::notice::Skipping an older commit; main has advanced."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CI_SHA="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$CANDIDATE_SHA" -f branch=main -f event=push -f status=completed -f per_page=20 \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0] | if .conclusion == "success" then .head_sha else "" end')"
          if [[ "$CI_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "::error::A successful completed main CI run is required for this exact commit."
            exit 1
          fi
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Cloudflare Pages production
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    environment:
      name: Production
      url: https://elite-mgmt-agency.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate and package public artifacts
        run: npm run build
      - name: Verify deployment configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" || -z "$CF_PROJECT" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PAGES_PROJECT before deployment."
            exit 1
          fi
          if [[ ! "$CF_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Invalid Cloudflare Pages project name."
            exit 1
          fi
      - name: Recheck main before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$DEPLOY_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Main advanced during packaging; no deployment will be performed."
            exit 1
          fi
      - name: Publish only the staged website
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ needs.gate.outputs.sha }} --commit-dirty=false
